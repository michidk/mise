name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mise
          POSTGRES_USER: mise
          POSTGRES_PASSWORD: mise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mise -d mise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mise:mise@127.0.0.1:5432/mise
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify:full
      - name: Check generated browser bundles
        run: git diff --exit-code -- public/app.js public/admin.js
